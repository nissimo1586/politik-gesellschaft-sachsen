name: Veranstaltungskalender aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: kalender-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m src.calendar_feed
      - name: Aktualisierte Kalender committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ data/cache.json data/last_run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Kalender automatisch aktualisieren'
            git push
          fi
